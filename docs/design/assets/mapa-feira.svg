  <rect x="420" y="300" width="7" height="35" rx="3" fill="#FACC15" />
  <text x="427" y="296" font-family="Inter, Arial, sans-serif" font-size="8" fill="#FACC15">porta</text>

  <text x="380" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">CORREDOR 2 m</text>

