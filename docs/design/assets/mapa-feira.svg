  <path d="M340 345 L420 315" stroke="#334155" stroke-width="38" stroke-linecap="butt" />
  <path d="M345 342 L412 315" stroke="#FACC15" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#seta)" />

