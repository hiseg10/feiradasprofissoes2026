  <text x="145" y="406" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">SABOR DO</text>
  <text x="145" y="421" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">FLORESTAN</text>
