    <rect x="100" y="550" width="10" height="10" rx="3" fill="#475569" />
    <text x="116" y="559">Corredor 2 m</text>
    <rect x="190" y="550" width="10" height="10" rx="3" fill="#7C3AED" />
    <text x="206" y="559">Biblioteca</text>
    <rect x="275" y="550" width="10" height="10" rx="3" fill="#EA580C" />
    <text x="291" y="559">Comida</text>
    <rect x="345" y="550" width="10" height="10" rx="3" fill="#16A34A" />
    <text x="361" y="559">Robótica + horta</text>
    <rect x="460" y="550" width="10" height="10" rx="3" fill="#0F766E" />
    <text x="476" y="559">CDQ</text>
    <rect x="515" y="550" width="10" height="10" rx="3" fill="#66C0F4" />
    <text x="531" y="559">Story Games</text>
