  <text x="145" y="466" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">FLORESTAN</text>
  <text x="145" y="480" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">CONECTA</text>
  <text x="145" y="493" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" fill="#CFFAFE">Turismo</text>

